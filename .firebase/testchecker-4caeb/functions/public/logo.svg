<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M32 3 L54 12 L54 32 C54 46 32 61 32 61 C32 61 10 46 10 32 L10 12 Z"
        fill="url(#shieldGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Inner shield border -->
  <path d="M32 9 L49 16.5 L49 32 C49 43 32 55 32 55 C32 55 15 43 15 32 L15 16.5 Z"
        fill="none" stroke="#00b8d4" stroke-width="0.8" opacity="0.5"/>

  <!-- Circuit lines -->
  <g stroke="#00e5ff" stroke-width="0.6" opacity="0.35">
    <!-- Top left branch -->
    <line x1="32" y1="28" x2="22" y2="22"/>
    <line x1="22" y1="22" x2="18" y2="22"/>
    <circle cx="18" cy="22" r="1" fill="#00e5ff"/>
    <line x1="22" y1="22" x2="22" y2="17"/>
    <circle cx="22" cy="17" r="1" fill="#00e5ff"/>

    <!-- Top right branch -->
    <line x1="32" y1="28" x2="42" y2="22"/>
    <line x1="42" y1="22" x2="46" y2="22"/>
    <circle cx="46" cy="22" r="1" fill="#00e5ff"/>
    <line x1="42" y1="22" x2="42" y2="17"/>
    <circle cx="42" cy="17" r="1" fill="#00e5ff"/>

    <!-- Bottom left branch -->
    <line x1="32" y1="44" x2="22" y2="48"/>
    <line x1="22" y1="48" x2="18" y2="48"/>
    <circle cx="18" cy="48" r="1" fill="#00e5ff"/>

    <!-- Bottom right branch -->
    <line x1="32" y1="44" x2="42" y2="48"/>
    <line x1="42" y1="48" x2="46" y2="48"/>
    <circle cx="46" cy="48" r="1" fill="#00e5ff"/>

    <!-- Bottom center -->
    <line x1="32" y1="44" x2="32" y2="52"/>
    <circle cx="32" cy="52" r="1" fill="#00e5ff"/>
  </g>

  <!-- Padlock body -->
  <rect x="24" y="35" width="16" height="13" rx="2.5" fill="white" opacity="0.95"/>

  <!-- Padlock shackle -->
  <path d="M27 35 L27 29.5 C27 25.9 37 25.9 37 29.5 L37 35"
        stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- Keyhole -->
  <circle cx="32" cy="41" r="2" fill="#0d47a1"/>
  <rect x="31" y="41" width="2" height="3.5" rx="0.8" fill="#0d47a1"/>

  <!-- Corner accent glow dots -->
  <circle cx="32" cy="5" r="1.5" fill="#00e5ff" opacity="0.8"/>
</svg>
